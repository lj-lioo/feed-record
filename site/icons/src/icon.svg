<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512"><stop offset="0" stop-color="#6FD6CB"/><stop offset="1" stop-color="#1A9C91"/></linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF6E6"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- 月亮和星星（夜里喂奶） -->
  <path d="M 420 70 a 50 50 0 1 0 38 78 a 40 40 0 1 1 -38 -78 z" fill="#FFE7A8"/>
  <circle cx="92" cy="96" r="7" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="140" cy="60" r="4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="440" cy="250" r="5" fill="#FFFFFF" opacity="0.6"/>
  <g transform="translate(256 290) rotate(-18)">
    <!-- 奶嘴 -->
    <path d="M -34 -150 C -34 -205 34 -205 34 -150 L 40 -128 L -40 -128 Z" fill="#FFC9A8"/>
    <!-- 瓶盖 -->
    <rect x="-66" y="-132" width="132" height="42" rx="16" fill="#FF9A76"/>
    <!-- 瓶身 -->
    <rect x="-80" y="-94" width="160" height="250" rx="46" fill="url(#milk)" stroke="#FFFFFF" stroke-width="8"/>
    <!-- 奶 -->
    <path d="M -76 10 C -40 -6 40 26 76 8 L 76 110 a 42 42 0 0 1 -42 42 L -34 152 a 42 42 0 0 1 -42 -42 Z" fill="#FFE3B8"/>
    <!-- 刻度 -->
    <g stroke="#9AD8D0" stroke-width="8" stroke-linecap="round">
      <line x1="30" y1="-50" x2="56" y2="-50"/><line x1="38" y1="-18" x2="56" y2="-18"/><line x1="30" y1="14" x2="56" y2="14"/>
    </g>
    <!-- 爱心 -->
    <path d="M 0 96 C -30 70 -34 50 -18 42 C -8 37 0 44 0 52 C 0 44 8 37 18 42 C 34 50 30 70 0 96 Z" fill="#FF8F7A"/>
  </g>
</svg>
